name: Release

on:
  push:
    tags:
      - 'v[1-9]*.*.*'   # All v1+ tags; -pre.N suffix flips to GitHub pre-release

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DR19 §12.5 — no -keep rule may expose com.voicedrop.crypto.** to
      # reflection. The ratchet, KeyManager, and RatchetState are only ever
      # touched from Kotlin call sites. A reflection allowance would silently
      # widen the attack surface; this grep fails the build before that ships.
      - name: Lint proguard rules for crypto reflection allowances
        run: |
          set -euo pipefail
          OFFENDERS=$(grep -nE 'com\.voicedrop\.crypto' app/proguard-rules.pro || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::proguard-rules.pro must not -keep com.voicedrop.crypto.** (DR19 §12.5)"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "proguard crypto reflection check OK"

      - name: Run unit tests + ratchet lint
        run: ./gradlew testReleaseUnitTest :app:ratchetLint --stacktrace

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release.keystore" \
            -Pandroid.injected.signing.store.password="voicedrop" \
            -Pandroid.injected.signing.key.alias="voicedrop" \
            -Pandroid.injected.signing.key.password="voicedrop" \
            --stacktrace

      # DR19 §12.2 — assert the signed APK's certificate fingerprint matches
      # the value pinned in tools/release/expected-signing-cert.sha256. Any
      # keystore swap (accidental or otherwise) fails the release here.
      - name: Verify APK signing-cert fingerprint
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK="app/build/outputs/apk/release/app-release.apk"
          EXPECTED="$(tr -d '[:space:]' < tools/release/expected-signing-cert.sha256)"
          if [ -z "$EXPECTED" ]; then
            echo "::error::tools/release/expected-signing-cert.sha256 is empty"
            exit 1
          fi
          ACTUAL="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}')"
          if [ -z "$ACTUAL" ]; then
            echo "::error::could not extract signer cert SHA-256 from $APK"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" || true
            exit 1
          fi
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signing-cert SHA-256 mismatch - refusing to publish"
            exit 1
          fi
          echo "signing-cert fingerprint OK"

      - name: Build release AAB
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release.keystore" \
            -Pandroid.injected.signing.store.password="voicedrop" \
            -Pandroid.injected.signing.key.alias="voicedrop" \
            -Pandroid.injected.signing.key.password="voicedrop" \
            --stacktrace

      # DR19 §12.3 (interim) — emit dex SHA-256 witnesses for the signed APK.
      # Full reproducible-build enforcement is deferred (see
      # tools/release/DR19-FOLLOWUPS.md §12.3); until then these hashes let an
      # external rebuilder verify the compiled bytecode matches the published
      # artifact without trusting the signature.
      - name: Emit dex SHA-256 witnesses
        id: dex_witness
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          mkdir -p /tmp/apk-witness
          (cd /tmp/apk-witness && unzip -qq -o "$GITHUB_WORKSPACE/$APK" 'classes*.dex')
          DEX_HASHES=$(cd /tmp/apk-witness && sha256sum classes*.dex | sort)
          echo "Dex witnesses for $GITHUB_REF_NAME:"
          echo "$DEX_HASHES"
          {
            echo "dex_witness<<EOF_DEX"
            echo "$DEX_HASHES"
            echo "EOF_DEX"
          } >> "$GITHUB_OUTPUT"

      - name: Extract version name
        id: version
        run: echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: VoiceDrop ${{ steps.version.outputs.name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          append_body: true
          body: |
            ### Build integrity (DR19 §12.3)

            Signing-cert SHA-256 (pinned in `tools/release/expected-signing-cert.sha256`):

            ```
            178eda83348f801bfc6a1e231758002936f9e71b2148a7210d25d98512db175f
            ```

            APK `classes*.dex` SHA-256 witnesses for an independent rebuild check:

            ```
            ${{ steps.dex_witness.outputs.dex_witness }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

