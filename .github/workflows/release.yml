name: Release

on:
  push:
    tags:
      - 'v[1-9]*.*.*'   # Production releases only (v1.x.x and above); v0.x.x handled by prerelease.yml

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release.keystore" \
            -Pandroid.injected.signing.store.password="voicedrop" \
            -Pandroid.injected.signing.key.alias="voicedrop" \
            -Pandroid.injected.signing.key.password="voicedrop" \
            --stacktrace

      - name: Build release AAB
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release.keystore" \
            -Pandroid.injected.signing.store.password="voicedrop" \
            -Pandroid.injected.signing.key.alias="voicedrop" \
            -Pandroid.injected.signing.key.password="voicedrop" \
            --stacktrace

      - name: Extract version name
        id: version
        run: echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VoiceDrop ${{ steps.version.outputs.name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

