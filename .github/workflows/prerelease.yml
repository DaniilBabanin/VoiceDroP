name: Pre-Release (Testing)

# Builds a release-signed APK for pre-release testing tags (v0.x.x)
# Signed with the same keystore as production so updates install over prior builds
on:
  push:
    tags:
      - 'v0.*.*'

jobs:
  prerelease:
    name: Build Testing APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/app/release.keystore"

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk \
             "voicedrop-${VERSION}.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VoiceDrop ${{ github.ref_name }} (Testing)"
          prerelease: true
          draft: false
          body: |
            ## VoiceDrop ${{ github.ref_name }} — Testing Build

            Pre-release build for internal testing. See [README.md](README.md) for setup instructions.

            ### Installation
            1. Enable "Install from unknown sources" on your device
            2. Download `voicedrop-${{ github.ref_name }}.apk`
            3. Install and follow the [setup guide](README.md#3-first-time-setup-do-on-both-phones)

            ### What to test
            - [ ] Deploy Cloudflare Worker, enter URL in Settings
            - [ ] Pair two devices via QR code
            - [ ] Send a voice message (Quick Settings tile)
            - [ ] Receive and play back the message
            - [ ] Test on LAN (both phones on same WiFi)
            - [ ] Test cross-network (one phone on LTE)
          files: voicedrop-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
