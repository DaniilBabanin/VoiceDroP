name: Pre-Release (Testing)

# Builds an unsigned debug APK for pre-release testing tags (v0.x.x)
# No keystore required — debug-signed by the Android build tools default key
on:
  push:
    tags:
      - 'v0.*.*'

jobs:
  prerelease:
    name: Build Testing APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "voicedrop-${VERSION}-debug.apk"

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          name: "VoiceDrop ${{ github.ref_name }} (Testing)"
          prerelease: true
          draft: false
          body: |
            ## VoiceDrop ${{ github.ref_name }} — Testing Build

            **This is an unsigned debug APK for internal testing only.**
            Not for production use. See [README.md](README.md) for setup instructions.

            ### Installation
            1. Enable "Install from unknown sources" on your device
            2. Download `voicedrop-${{ github.ref_name }}-debug.apk`
            3. Install and follow the [setup guide](README.md#3-first-time-setup-do-on-both-phones)

            ### What to test
            - [ ] Deploy Cloudflare Worker, enter URL in Settings
            - [ ] Pair two devices via QR code
            - [ ] Send a voice message (Quick Settings tile)
            - [ ] Receive and play back the message
            - [ ] Test on LAN (both phones on same WiFi)
            - [ ] Test cross-network (one phone on LTE)
          files: voicedrop-${{ github.ref_name }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
