name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DR19 §12.5 — block reflection allowances on com.voicedrop.crypto.**
      # before they can land via PR. Mirrored in release.yml.
      - name: Lint proguard rules for crypto reflection allowances
        run: |
          set -euo pipefail
          OFFENDERS=$(grep -nE 'com\.voicedrop\.crypto' app/proguard-rules.pro || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::proguard-rules.pro must not -keep com.voicedrop.crypto.** (DR19 §12.5)"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "proguard crypto reflection check OK"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug :app:ratchetLint --stacktrace 2>&1 | tee /tmp/build.log
          build_exit=${PIPESTATUS[0]}
          if [ $build_exit -ne 0 ]; then
            echo ""
            echo "══════════════════════════════════════════"
            echo "  BUILD FAILED — KOTLIN/GRADLE ERRORS"
            echo "══════════════════════════════════════════"
            echo ""
            echo "--- Kotlin compiler errors (e:) ---"
            grep -E "^e: " /tmp/build.log || echo "(none)"
            echo ""
            echo "--- Failed tasks ---"
            grep -E "^FAILURE:|> Task .*FAILED|What went wrong" /tmp/build.log || echo "(none)"
            echo ""
            echo "--- Exception / caused by ---"
            grep -iE "^Caused by:|exception in thread|unresolved reference|error:" /tmp/build.log | head -30 || echo "(none)"
            echo ""
            echo "--- Last 40 lines of build output ---"
            tail -40 /tmp/build.log
            echo "══════════════════════════════════════════"
            exit $build_exit
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voicedrop-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  worker-tests:
    name: Worker tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # vitest-pool-workers runs the suite inside workerd. package-lock.json is
      # committed, so `npm ci` gives reproducible dependency resolution. The
      # worker auto-deploys via Cloudflare Git integration with no test gate, so
      # this job is the only automated check of the mailbox-auth crypto (A1).
      - name: Install dependencies
        run: npm ci

      - name: Run worker unit tests
        run: npm test

  unit-tests:
    name: Unit tests (JVM/Robolectric)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run crypto + storage + network + audio unit tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests "com.voicedrop.crypto.*" \
            --tests "com.voicedrop.storage.*" \
            --tests "com.voicedrop.network.*" \
            --tests "com.voicedrop.audio.*" \
            --stacktrace
