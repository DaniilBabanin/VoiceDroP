name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          build_exit=${PIPESTATUS[0]}
          if [ $build_exit -ne 0 ]; then
            echo ""
            echo "══════════════════════════════════════════"
            echo "  BUILD FAILED — KOTLIN/GRADLE ERRORS"
            echo "══════════════════════════════════════════"
            echo ""
            echo "--- Kotlin compiler errors (e:) ---"
            grep -E "^e: " /tmp/build.log || echo "(none)"
            echo ""
            echo "--- Failed tasks ---"
            grep -E "^FAILURE:|> Task .*FAILED|What went wrong" /tmp/build.log || echo "(none)"
            echo ""
            echo "--- Exception / caused by ---"
            grep -iE "^Caused by:|exception in thread|unresolved reference|error:" /tmp/build.log | head -30 || echo "(none)"
            echo ""
            echo "--- Last 40 lines of build output ---"
            tail -40 /tmp/build.log
            echo "══════════════════════════════════════════"
            exit $build_exit
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voicedrop-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
