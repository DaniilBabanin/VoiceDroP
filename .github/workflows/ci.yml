name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      is_tagged: ${{ steps.check.outputs.is_tagged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Check if commit is tagged
        id: check
        run: |
          tags=$(git tag --points-at HEAD)
          if [ -n "$tags" ]; then
            echo "Commit has tags: $tags — release.yml handles tagged builds. Skipping debug build."
            echo "is_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tagged=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build APK
    needs: check
    if: needs.check.outputs.is_tagged != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" > /dev/null 2>&1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DR19 §12.5 — block reflection allowances on com.voicedrop.crypto.**
      # before they can land via PR. Mirrored in release.yml.
      - name: Lint proguard rules for crypto reflection allowances
        run: |
          set -euo pipefail
          OFFENDERS=$(grep -nE 'com\.voicedrop\.crypto' app/proguard-rules.pro || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::proguard-rules.pro must not -keep com.voicedrop.crypto.** (DR19 §12.5)"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "proguard crypto reflection check OK"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug :app:ratchetLint --stacktrace 2>&1 | tee /tmp/build.log
          build_exit=${PIPESTATUS[0]}
          if [ $build_exit -ne 0 ]; then
            echo ""
            echo "══════════════════════════════════════════"
            echo "  BUILD FAILED — KOTLIN/GRADLE ERRORS"
            echo "══════════════════════════════════════════"
            echo ""
            echo "--- Kotlin compiler errors (e:) ---"
            grep -E "^e: " /tmp/build.log || echo "(none)"
            echo ""
            echo "--- Failed tasks ---"
            grep -E "^FAILURE:|> Task .*FAILED|What went wrong" /tmp/build.log || echo "(none)"
            echo ""
            echo "--- Exception / caused by ---"
            grep -iE "^Caused by:|exception in thread|unresolved reference|error:" /tmp/build.log | head -30 || echo "(none)"
            echo ""
            echo "--- Last 40 lines of build output ---"
            tail -40 /tmp/build.log
            echo "══════════════════════════════════════════"
            exit $build_exit
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voicedrop-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
